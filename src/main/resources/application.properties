spring.application.name=placement-management-system

# Every value below can be overridden by an environment variable of the same
# name (in SCREAMING_SNAKE_CASE) so the same jar/image runs locally and on a
# hosted platform (Render, Railway, etc.) without code changes. See
# DEPLOYMENT.md for a free hosting walkthrough.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sandesh}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Keeps the database connection scoped to the service layer instead of holding it
# open for the whole request. Every entity relationship must be fully loaded
# inside a @Transactional service method before it leaves that method.
spring.jpa.open-in-view=false

# Most free hosts (Render, Railway, Fly.io) assign the port at runtime via $PORT.
server.port=${PORT:8080}

# JWT auth (Step 12). Override app.jwt.secret via the JWT_SECRET env var in real deployments.
app.jwt.secret=${JWT_SECRET:ThisIsADemoJwtSecretKeyForPlacementManagementSystemChangeMeInProduction123456}
app.jwt.expiration-ms=86400000