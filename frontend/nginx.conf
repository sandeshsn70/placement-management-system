server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: the browser only ever talks to this one host,
    # so there's no CORS to configure and no separate backend URL to manage.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing: an unknown path (e.g. a refresh on
    # /jobs) falls back to index.html instead of a raw 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
